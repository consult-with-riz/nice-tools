<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Opening in YouTube...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="font-family: Arial, sans-serif; text-align: center; margin-top: 20%; background-color: #f9f9f9;">
    <h3>Redirecting to the YouTube App...</h3>
    <p>If it doesn't open automatically, <a id="fallback-link" href="#">click here</a>.</p>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let u = urlParams.get('u');
        
        if (u) {
            if (!u.startsWith('http')) { u = 'https://' + u; }
            document.getElementById('fallback-link').href = u;
            
            // Extract the 11-character YouTube video ID
            let videoId = '';
            if (u.includes('youtu.be/')) {
                videoId = u.split('youtu.be/')[1].split(/[?#]/)[0];
            } else if (u.includes('v=')) {
                videoId = u.split('v=')[1].split('&')[0];
            } else if (u.includes('shorts/')) {
                videoId = u.split('shorts/')[1].split(/[?#]/)[0];
            }

            if (videoId) {
                const isAndroid = /Android/i.test(navigator.userAgent);
                const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

                if (isAndroid) {
                    // Forces Android to open the native app or fallback to browser
                    window.location.href = `intent://www.youtube.com/watch?v=${videoId}#Intent;package=com.google.android.youtube;scheme=https;end`;
                } else if (isIOS) {
                    // Forces iOS app scheme, falls back to web link if it fails
                    window.location.href = `youtube://www.youtube.com/watch?v=${videoId}`;
                    setTimeout(() => { window.location.href = u; }, 1500);
                } else {
                    window.location.href = u; // Desktop fallback
                }
            } else {
                window.location.href = u;
            }
        } else {
            document.body.innerHTML = "<h3>Error: No URL provided. Append ?u=YOUR_LINK to the end of this URL.</h3>";
        }
    </script>
</body>
</html>
